<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Agriculture - Monitoring & Kontrol Cabai</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background-glow"></div>

<div class="container">
    <header class="app-header">
        <div class="header-icon"><i class="fa-solid fa-seedling"></i></div>
        <h1>Smart Farm <span>Bibit Cabai</span></h1>
        <p class="subtitle">Sistem Penyiraman & Monitoring Real-time</p>
    </header>
    
    <div id="mqtt-status" class="status-badge disconnected">
        <span class="status-dot"></span>
        <span id="mqtt-status-text">Status: Terputus</span>
    </div>

    <div class="sensor-grid">
        <div class="sensor-card soil">
            <div class="card-header">
                <span class="sensor-title">Kelembapan Tanah</span>
                <i class="fa-solid fa-droplet icon-soil"></i>
            </div>
            <div class="card-body">
                <div id="humi1-val" class="sensor-value">0<small>%</small></div>
            </div>
            <div class="progress-bar-container">
                <div id="soil-progress" class="progress-bar" style="width: 0%;"></div>
            </div>
        </div>

        <div class="sensor-card temp">
            <div class="card-header">
                <span class="sensor-title">Suhu Udara</span>
                <i class="fa-solid fa-temperature-half icon-temp"></i>
            </div>
            <div class="card-body">
                <div id="temp-val" class="sensor-value">0<small>°C</small></div>
            </div>
            <div class="progress-bar-container">
                <div id="temp-progress" class="progress-bar temp-bar" style="width: 0%;"></div>
            </div>
        </div>

        <div class="sensor-card air-humi">
            <div class="card-header">
                <span class="sensor-title">Kelembapan Udara</span>
                <i class="fa-solid fa-wind icon-air"></i>
            </div>
            <div class="card-body">
                <div id="air-humi-val" class="sensor-value">0<small>%</small></div>
            </div>
            <div class="progress-bar-container">
                <div id="air-humi-progress" class="progress-bar air-bar" style="width: 0%;"></div>
            </div>
        </div>
    </div>

    <div id="pump-status" class="pump-indicator off">
        <i class="fa-solid fa-power-off pump-icon"></i>
        <span id="pump-status-text">Status Pompa: MATI</span>
    </div>

    <div class="control-section">
        <div class="control-title"><i class="fa-solid fa-sliders"></i> Kontrol Pompa</div>
        <div class="btn-group">
            <button class="btn-on" onclick="sendControl('ON')">
                <i class="fa-solid fa-play"></i> HIDUPKAN
            </button>
            <button class="btn-off" onclick="sendControl('OFF')">
                <i class="fa-solid fa-stop"></i> MATIKAN
            </button>
            <button class="btn-auto" onclick="sendControl('AUTO')">
                <i class="fa-solid fa-robot"></i> OTOMATIS
            </button>
        </div>

        <div class="control-title"><i class="fa-solid fa-clock"></i> Setel Timer Maksimal</div>
        <div class="timer-group">
            <div class="input-wrapper">
                <input type="number" id="timer-input" value="1" min="1" max="60">
                <span class="unit">Menit</span>
            </div>
            <button class="btn-save" onclick="sendTimer()">
                <i class="fa-solid fa-floppy-disk"></i> SIMPAN
            </button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
